
name: HTML to PNG

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Make.com JSON data"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Save JSON data
        env:
          JSON_DATA: ${{ inputs.data }}
        run: |
          mkdir -p input
          printf '%s' "$JSON_DATA" > input/data.json
          node -e "JSON.parse(require('fs').readFileSync('input/data.json', 'utf8')); console.log('JSON 데이터 확인 완료')"

      - name: Render HTML to PNG
        run: npm run render

      - name: Upload PNG images
        uses: actions/upload-artifact@v4
        with:
          name: economy-instagram-images
          path: output/*.png
          if-no-files-found: error
          retention-days: 7


name: HTML to JPEG

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Make.com JSON data"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Save JSON data
        env:
          JSON_DATA: ${{ inputs.data }}
        run: |
          mkdir -p input
          printf '%s' "$JSON_DATA" > input/data.json
          node -e "JSON.parse(require('fs').readFileSync('input/data.json', 'utf8')); console.log('JSON 데이터 확인 완료')"

      - name: Render HTML to JPEG
        run: npm run render

      - name: Upload JPEG images
        uses: actions/upload-artifact@v4
        with:
          name: economy-instagram-images
          path: output/*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Save JPEG images to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/
          git commit -m "Update Instagram JPEG images" || echo "No changes to commit"
          git push

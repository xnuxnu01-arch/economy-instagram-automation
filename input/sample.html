
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>경제 인스타그램 테스트</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 1080px;
      height: 1350px;
      background: #101010;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card {
      width: 900px;
      padding: 80px;
      border: 3px solid #c9a44c;
    }

    h1 {
      color: #d4af62;
      font-size: 65px;
    }

    p {
      font-size: 32px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ECONOMY NEWS</h1>
    <p>경제 인스타그램 자동화 테스트</p>
    <p>BLACK & GOLD EDITION</p>
  </div>
</body>
</html>
